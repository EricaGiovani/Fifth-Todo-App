<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do App</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
  <header> 
    <div class="header-left">
      <p>Let's Make Your List!</p>
    </div>
    <div class="header-right"> 
      <h1>To Do App</h1>
      <p>Organize your activities.</p>
    </div>
  </header>

  <main>
    <section class="add-activities">
      <div class="form-row">
        <div class="form-1">
          <label for="title">Title Activities</label>
          <input type="text" id="title" placeholder="+ Add Your Title Activities">
        </div>
        <div class="form-2">
          <label for="title">Date</label>
          <input type="date" id="date">
        </div>
      </div>
      <div class="form-row">
        <div class="form-3">
          <label for="title">Description Activities</label>
          <input type="text" id="title" placeholder="+ Add Your Description Activities">
        </div>
        <div class="form-4">
          <label for="title">Time</label>
          <input type="date" id="date">
        </div>
      </div>
      <button type="button" id="add-activities">Add Activities</button>
    </section>
  </main>
</body>
</html>
